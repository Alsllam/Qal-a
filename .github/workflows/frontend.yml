name: frontend

on:
  push:
    paths: ['frontend/**', 'brand/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'brand/**', '.github/workflows/frontend.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # postinstall runs tools/sync-brand.mjs (copies ../brand into the workspace)
      - run: npm ci
      - run: npx nx run-many -t lint test build
