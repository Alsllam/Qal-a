name: mobile

on:
  push:
    paths: ['mobile/**', 'packages/**', 'brand/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'packages/**', 'brand/**', '.github/workflows/mobile.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --exclude-tags golden --coverage
      - name: Golden screenshots (informational)
        run: flutter test --tags golden
        continue-on-error: true

  build-android:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug --flavor dev -t lib/main_dev.dart --dart-define-from-file=dart_defines/dev.json
