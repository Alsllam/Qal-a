name: backend

on:
  push:
    paths:
      - 'backend/**'
      - 'packages/game_core/test_vectors/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'packages/game_core/test_vectors/**'
      - '.github/workflows/backend.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore Qala.Game.sln
      - name: Build
        run: dotnet build Qala.Game.sln --no-restore --configuration Release -warnaserror
      - name: Test (includes the rules parity suite against packages/game_core/test_vectors)
        run: dotnet test Qala.Game.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage"
      - name: Check migrations are up to date
        run: |
          dotnet tool restore
          for spec in \
            "Modules/Matches/Qala.Game.Matches.EntityFrameworkCore MatchesDbContext" \
            "Modules/Players/Qala.Game.Players.EntityFrameworkCore PlayersDbContext" \
            "Shared/Qala.Framework.EntityFrameworkCore QalaIdentityDbContext"; do
            set -- $spec
            dotnet ef migrations has-pending-model-changes -p "$1" -s Shared/Qala.Game.DbMigrator -c "$2" --configuration Release --no-build
          done
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/TestResults/**
