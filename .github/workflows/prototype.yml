name: prototype

on:
  push:
    paths: ['prototype/**', 'packages/**', '.github/workflows/prototype.yml']
  pull_request:
    paths: ['prototype/**', 'packages/**', '.github/workflows/prototype.yml']

jobs:
  test-and-build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: prototype-web
          path: prototype/build/web
          retention-days: 30
