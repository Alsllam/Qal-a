[project]
name = "ai-service"
version = "0.1.0"
description = "Qal'a AI coach: rules Q&A (RAG) and post-game review on Azure OpenAI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "openai>=1.106,<3",  # 3.x moved to httpx2, which respx cannot mock yet
    "azure-identity>=1.19",
    "azure-search-documents>=11.5",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "tenacity>=9.0",
    "tiktoken>=0.7",
    "structlog>=24.1",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts", "evals"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PL", "N"]
ignore = [
    "PLR0913",  # keyword-only service constructors
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "PLC0415",  # lazy imports of Azure SDK modules
    "PLR0911",  # error mappers return per case
    "RUF001",   # Arabic text and typographic characters are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"evals/**" = ["S101", "T201"]
"scripts/**" = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["azure.*", "sse_starlette.*", "tiktoken.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["azure: smoke tests against real Azure resources (need credentials; skipped by default)"]
addopts = "-m 'not azure'"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
